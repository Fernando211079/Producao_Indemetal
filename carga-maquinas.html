<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEMETAL | Carga das Máquinas</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/carga-maquinas.css">
    <link rel="stylesheet" href="css/calendario-carga.css">
    <script src="js/auto-scale.js"></script>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-brand">
        <div class="topbar-logo">INDEMETAL</div>
        <div class="topbar-sub">CARGA DAS MÁQUINAS</div>
    </div>
    <div class="topbar-actions">
        <button class="btn-sec" onclick="window.location='cadastro-op.html'">+ NOVA OP</button>
        <button class="btn-sec" onclick="carregarTudo()">↺ ATUALIZAR</button>
        <button class="btn-sec" onclick="window.location='index.html'">← VOLTAR</button>
    </div>
</header>

<!-- KPIs GLOBAIS -->
<div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">OPs EM ABERTO</div><div class="kpi-val" id="kpi-ops">--</div></div>
    <div class="kpi-card"><div class="kpi-label">IMPRESSÕES PENDENTES</div><div class="kpi-val" id="kpi-imp">--</div></div>
    <div class="kpi-card"><div class="kpi-label">HORAS COMPROMETIDAS</div><div class="kpi-val" id="kpi-dias" style="font-size:1.2rem">--</div></div>
    <div class="kpi-card"><div class="kpi-label">FAM. SOBRECARREGADAS</div><div class="kpi-val" id="kpi-sobre">--</div></div>
    <div class="kpi-card"><div class="kpi-label">URGENTES / EMERGÊNCIAS</div><div class="kpi-val" id="kpi-urg">--</div></div>
</div>

<!-- MINI-CARDS DE SELEÇÃO (um por família) -->
<div class="selecao-titulo">SELECIONE A FAMÍLIA</div>
<div class="selecao-wrap" id="selecaoWrap">
    <div class="loading-mini">CARREGANDO...</div>
</div>

<!-- DETALHE DA FAMÍLIA SELECIONADA (tela toda) -->
<div class="detalhe-wrap" id="detalheWrap">
    <div class="detalhe-placeholder">
        ← Selecione uma família acima para ver o detalhe completo
    </div>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="js/firebase.js"></script>
<script src="js/configuracoes.js"></script>
<script src="js/calendario-carga.js"></script>
<script src="js/carga-maquinas.js"></script>

</body>
</html>
